[package]
name = "game-translator"
version = "0.1.0"
edition = "2021"
description = "Lightweight real-time EN->TH game text translator (OCR + Gemini)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }

[build-dependencies]
embed-resource = "2"

[dependencies.windows]
version = "0.58"
features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_WinRT",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
